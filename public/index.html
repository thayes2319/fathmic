<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Domainify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>Domainify</h1>
      <p class="tagline">Take a word or a sentence. Evolve it into understanding.</p>
    </header>

    <section id="input-section">
      <label for="subject-input">What do you want to understand?</label>
      <textarea id="subject-input" rows="2" placeholder="e.g. I want to plant a food garden in Georgia, U.S."></textarea>
      <button id="distill-btn">Distill</button>
      <p id="gate-status" class="status"></p>

      <div id="demo-cases">
        <span class="demo-label">Or load a demo case:</span>
        <div id="demo-buttons"></div>
      </div>
    </section>

    <section id="clarify-section" hidden>
      <p id="clarify-question"></p>
      <input id="clarify-answer" type="text" placeholder="Your answer" />
      <button id="clarify-submit-btn">Continue</button>
      <button id="clarify-skip-btn" class="skip-btn">Skip — just give me something general</button>
    </section>

    <section id="taxonomy-section" hidden>
      <h2 id="topic-heading"></h2>
      <div id="expand-controls">
        <button id="expand-all-btn" class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          Expand all
        </button>
        <button id="collapse-all-btn" class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
          Collapse all
        </button>
        <button id="pick-all-btn" class="pick-btn" title="Accepts Given categories generally, picks one specific option per subcategory worth exploring, across everything. Won't touch anything you've already chosen.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
          Pick for me
        </button>
      </div>
      <div id="taxonomy-tree"></div>
    </section>

    <section id="genre-section" hidden>
      <div id="stakes-control">
        <div class="stakes-knob">
          <div class="stakes-knob-label">Stakes</div>
          <div class="stakes-positions">
            <button class="stakes-pos" data-stakes="low">
              <span class="stakes-dot"></span>
              <span class="stakes-pos-text">Low</span>
            </button>
            <button class="stakes-pos" data-stakes="medium">
              <span class="stakes-dot"></span>
              <span class="stakes-pos-text">Medium</span>
            </button>
            <button class="stakes-pos" data-stakes="high">
              <span class="stakes-dot"></span>
              <span class="stakes-pos-text">High</span>
            </button>
          </div>
        </div>
        <span class="stakes-caption">How much is riding on this?</span>
      </div>

      <h2>How should this come together?</h2>
      <div id="genre-buttons">
        <button data-genre="summary">Summary</button>
        <button data-genre="essay">Essay</button>
        <button data-genre="story">Story</button>
        <button data-genre="argument">Argument</button>
        <button data-genre="action_item">Action items</button>
        <button data-genre="definition">Definition</button>
      </div>
    </section>

    <section id="output-section" hidden>
      <h2 id="output-heading">Result</h2>

      <div id="stale-banner" hidden>
        <span>Selections changed since this was generated.</span>
        <button id="regenerate-btn">Regenerate</button>
      </div>

      <div id="reference-cards">
        <div class="ref-card" data-card="popularity">
          <button id="popularity-btn">Check topic reach</button>
        </div>
        <div class="ref-card" data-card="photo">
          <button id="photo-btn">Get relevant photo</button>
        </div>
        <div class="ref-card" data-card="illustration">
          <button id="illustrate-btn">Generate illustration</button>
        </div>
      </div>

      <pre id="output-text"></pre>
    </section>
  </main>

  <script src="demo-fixtures.js"></script>
  <script src="app.js"></script>
</body>
</html>
