services:
  - type: web
    name: fathmic
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: RESEND_API_KEY
        sync: false
      - key: BLUEPRINT_NOTIFY_EMAIL
        value: thomas@gohw.net
