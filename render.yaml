services:
  - type: web
    name: fathmic
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: fathmic-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: RESEND_API_KEY
        sync: false
      - key: BLUEPRINT_NOTIFY_EMAIL
        value: thomas@gohw.net
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /data
